# Menu de inicialização do pendrive do Brisa Suave OS
set default=0
set timeout=8

insmod all_video
insmod gfxterm
insmod png
if loadfont unicode ; then
  set gfxmode=auto
  terminal_output gfxterm
fi
if background_image /boot/grub/fundo.png ; then
  set color_normal=white/black
  set color_highlight=black/light-cyan
else
  set color_normal=white/blue
  set color_highlight=blue/white
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

set opcoes="boot=live components quiet splash loglevel=3 locales=pt_BR.UTF-8 keyboard-layouts=br keyboard-model=abnt2 timezone=America/Sao_Paulo username=brisa hostname=brisa-suave"

menuentry "Experimentar ou instalar o Brisa Suave OS" {
  linux /live/vmlinuz $opcoes
  initrd /live/initrd.img
}

menuentry "Brisa Suave OS - video basico (se a tela ficar preta)" {
  linux /live/vmlinuz $opcoes nomodeset
  initrd /live/initrd.img
}

menuentry "Brisa Suave OS - carregar tudo na memoria (so para PCs com 4 GB ou mais)" {
  linux /live/vmlinuz $opcoes toram
  initrd /live/initrd.img
}

menuentry "Desligar" {
  halt
}
